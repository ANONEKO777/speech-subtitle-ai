[project]
name = "video-subtitle-translator"
version = "0.0.0"
description = "Turn English talk videos into English and Traditional Chinese (Taiwan) bilingual subtitles and a summary."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "editables>=0.5",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
dev-mode-exact = true

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
