name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models/silero-vad
          key: silero-vad-${{ hashFiles('scripts/fetch_silero_vad.py') }}
      - run: uv run python scripts/fetch_silero_vad.py
      - run: choco install ffmpeg --version=7.1.1 --yes --no-progress
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
        env:
          VST_REQUIRE_ASSETS: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run check:strings

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the frontend (tauri-build needs app/dist)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --locked

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
      - run: uv sync --locked
      - name: Syntax-check the Mac scripts
        run: |
          for f in scripts/mac/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
      - name: Mac code paths
        run: uv run pytest tests/test_macos_*.py tests/test_parent_watch.py tests/test_process_guard.py
      - name: Preflight (read-only; its verdict about this runner is informational)
        run: |
          set +e
          out="$(bash scripts/mac/preflight.sh 2>&1)"
          code=$?
          echo "$out"
          echo "preflight exit code: $code"
          if [ -z "$out" ]; then
            echo "preflight printed nothing" >&2
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "preflight crashed (exit $code)" >&2
            exit 1
          fi
