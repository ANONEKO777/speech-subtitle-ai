name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: models/silero-vad
          key: silero-vad-${{ hashFiles('scripts/fetch_silero_vad.py') }}
      - run: uv run python scripts/fetch_silero_vad.py
      - run: choco install ffmpeg --version=7.1.1 --yes --no-progress
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
        env:
          VST_REQUIRE_ASSETS: "1"
